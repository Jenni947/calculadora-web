 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>CALC CLUB - Torcida que calcula!</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="app">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">⚽</div>
                <div>
                    <h1>CALC <span>CLUB</span></h1>
                    <p>TORCIDA QUE CALCULA!</p>
                </div>
            </div>

            <div class="section-title">
                <span>ESCOLHA SEU TIME</span>
            </div>

            <div id="team-list" class="team-list"></div>

            <div class="sidebar-footer">
                <span>⚽</span>
                <p>MAIS QUE UMA CALCULADORA.<br>UMA PAIXÃO!</p>
            </div>
        </aside>

        <section class="calculator">

            <header class="topbar">
                <div>
                    <span class="small-label">CALC CLUB / CALCULADORA</span>
                    <h2 id="team-name">Corinthians</h2>
                </div>
                <span class="live-dot">● ONLINE</span>
            </header>

            <section class="display-area">
                <div class="display-team">
                    <img id="main-crest" src="" alt="Escudo do time">
                    <span id="display-team-name">CORINTHIANS</span>
                </div>

                <div id="history" class="history"></div>
                <div id="display" class="display">0</div>
                <div class="display-caption">SEU RESULTADO</div>
            </section>

            <div class="keypad">

                <button class="key memory" data-action="memory-clear">MC</button>
                <button class="key memory" data-action="memory-recall">MR</button>
                <button class="key memory" data-action="memory-add">M+</button>
                <button class="key memory" data-action="memory-subtract">M−</button>

                <button class="key clear" data-action="clear">C</button>
                <button class="key" data-action="sign">±</button>
                <button class="key" data-action="percent">%</button>
                <button class="key operator" data-value="/">÷</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key operator" data-value="*">×</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key operator" data-value="-">−</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key zero" data-value="0">0</button>
                <button class="key" data-action="decimal">,</button>
                <button class="key equals" data-action="equals">=</button>

            </div>

            <footer class="calculator-footer">
                <span>CALC CLUB</span>
                <span id="footer-team">VAI CORINTHIANS!</span>
            </footer>

        </section>
    </main>
</body>
</html>
