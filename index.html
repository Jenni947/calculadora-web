
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101014">
    <title>CALC CLUB — Sua paixão em números</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="app">

        <header class="topo">
            <div class="marca">
                <span class="marca-icone">C</span>
                <div>
                    <h1>CALC CLUB</h1>
                    <p>SUA PAIXÃO EM NÚMEROS</p>
                </div>
            </div>

            <button class="botao-config" id="abrirConfig"
                aria-label="Personalizar calculadora">⚙</button>
        </header>

        <section class="identidade">
            <div class="escudo-fundo" id="escudoFundo"></div>
            <div class="time-info">
                <span class="etiqueta">EDIÇÃO DO TORCEDOR</span>
                <h2 id="nomeTime">CORINTHIANS</h2>
                <p>CALCULADORA PERSONALIZADA</p>
            </div>
        </section>

        <section class="calculadora">
            <div class="visor-area">
                <span class="visor-legenda">RESULTADO</span>
                <input id="visor" type="text" value="0" readonly aria-label="Resultado da calculadora">
            </div>

            <div class="botoes">
                <button class="especial" onclick="limpar()">AC</button>
                <button class="especial" onclick="apagar()">⌫</button>
                <button class="operador" onclick="adicionar('/')">÷</button>
                <button class="operador" onclick="adicionar('*')">×</button>

                <button onclick="adicionar('7')">7</button>
                <button onclick="adicionar('8')">8</button>
                <button onclick="adicionar('9')">9</button>
                <button class="operador" onclick="adicionar('-')">−</button>

                <button onclick="adicionar('4')">4</button>
                <button onclick="adicionar('5')">5</button>
                <button onclick="adicionar('6')">6</button>
                <button class="operador" onclick="adicionar('+')">+</button>

                <button onclick="adicionar('1')">1</button>
                <button onclick="adicionar('2')">2</button>
                <button onclick="adicionar('3')">3</button>
                <button class="igual" onclick="calcular()">=</button>

                <button class="zero" onclick="adicionar('0')">0</button>
                <button onclick="adicionar('.')">.</button>
            </div>
        </section>

        <footer>
            <span>CALC CLUB</span>
            <span>FEITA PARA TORCER.</span>
        </footer>

    </main>

    <dialog id="painelConfig">
        <div class="config-conteudo">
            <div class="config-topo">
                <div>
                    <span class="etiqueta">PERSONALIZAÇÃO</span>
                    <h2>Seu clube, seu estilo.</h2>
                </div>
                <button id="fecharConfig" class="fechar">×</button>
            </div>

            <label for="nomePersonalizado">Nome do time</label>
            <input id="nomePersonalizado" type="text" value="CORINTHIANS" maxlength="25">

            <label for="arquivoEscudo">Imagem do escudo</label>
            <input id="arquivoEscudo" type="file" accept="image/png,image/jpeg,image/webp">

            <label for="corFundo">Cor de fundo</label>
            <input id="corFundo" type="color" value="#101014">

            <label for="corDestaque">Cor de destaque</label>
            <input id="corDestaque" type="color" value="#ed172f">

            <label for="corBotoes">Cor dos botões</label>
            <input id="corBotoes" type="color" value="#24242b">

            <button id="aplicarTema" class="aplicar">APLICAR PERSONALIZAÇÃO</button>
            <button id="restaurarTema" class="restaurar">RESTAURAR TEMA INICIAL</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
